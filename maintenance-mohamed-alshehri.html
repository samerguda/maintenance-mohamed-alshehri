<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Details van de rekening & Live Clock</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --accent: #00897b;
      --accent-light: #e0f2f1;
      --border-color: #e5e7eb;
      --whatsapp-color: #25d366;
      --whatsapp-bg: #e8f8ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* Live Clock Widget */
    .clock-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.25rem 2.5rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 2rem;
      width: 100%;
      max-width: 500px;
    }

    .clock-time {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .clock-date {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Details Card */
    .details-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 1.75rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .card-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #111827;
    }

    .details-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #f3f4f6;
      gap: 0.5rem;
    }

    .detail-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .info-group {
      display: flex;
      flex-direction: column;
    }

    .label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Copy Button */
    .btn-copy {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-copy:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Action Buttons */
    .actions-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .btn-action {
      border-radius: 12px;
      padding: 0.85rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-whatsapp {
      background-color: var(--whatsapp-bg);
      color: #0f5132;
      border: 1px solid var(--whatsapp-color);
    }

    .btn-whatsapp:hover {
      background-color: #d1e7dd;
    }

    .btn-rib {
      background-color: var(--accent-light);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn-rib:hover {
      background-color: #b2dfdb;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      background: #111827;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 20px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Real-Time Clock & Date Widget -->
  <div class="clock-container">
    <div class="clock-time" id="time">00:00:00</div>
    <div class="clock-date" id="date">--</div>
  </div>

  <!-- Account Details Card -->
  <div class="details-card">
    <div class="card-header">
      <div class="card-title">Details van de rekening</div>
    </div>

    <div class="details-list">
      
      <div class="detail-item">
        <div class="info-group">
          <span class="label">Naam rekeninghouder</span>
          <span class="value" id="val-naam">MME MOUNYA HAFIDI</span>
        </div>
        <button class="btn-copy" onclick="copyText('MME MOUNYA HAFIDI', 'Naam')">نسخ</button>
      </div>

      <div class="detail-item">
        <div class="info-group">
          <span class="label">Benaming rekening</span>
          <span class="value" id="val-benaming">MME MOUNYA HAFIDI</span>
        </div>
        <button class="btn-copy" onclick="copyText('MME MOUNYA HAFIDI', 'Benaming')">نسخ</button>
      </div>

      <div class="detail-item">
        <div class="info-group">
          <span class="label">Rekeningnummer</span>
          <span class="value" id="val-iban">BE80 0004 3273 4477</span>
        </div>
        <button class="btn-copy" onclick="copyText('BE80 0004 3273 4477', 'Rekeningnummer')">نسخ</button>
      </div>

      <div class="detail-item">
        <div class="info-group">
          <span class="label">BIC</span>
          <span class="value" id="val-bic">GEBABEBB</span>
        </div>
        <button class="btn-copy" onclick="copyText('GEBABEBB', 'BIC')">نسخ</button>
      </div>

      <div class="detail-item">
        <div class="info-group">
          <span class="label">Uw relatie tot de rekening</span>
          <span class="value">Titulaire</span>
        </div>
        <button class="btn-copy" onclick="copyText('Titulaire', 'Relatie')">نسخ</button>
      </div>

      <div class="detail-item">
        <div class="info-group">
          <span class="label">Rekeningtype</span>
          <span class="value">Pack Easy Go</span>
        </div>
        <button class="btn-copy" onclick="copyText('Pack Easy Go', 'Rekeningtype')">نسخ</button>
      </div>

    </div>

    <!-- Action Buttons -->
    <div class="actions-group">
      <a href="#" class="btn-action btn-whatsapp" onclick="sendWhatsApp(event)">
        💬 إرسال التفاصيل عبر WhatsApp
      </a>
      <div class="btn-action btn-rib" onclick="copyAllDetails()">
        📋 نسخ جميع البيانات
      </div>
    </div>
  </div>

  <div class="toast" id="toast">تم النسخ بنجاح!</div>

  <script>
    // Live Clock Logic
    function updateClock() {
      const now = new Date();
      
      const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      document.getElementById('time').textContent = now.toLocaleTimeString('en-US', timeOptions);

      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('ar-EG', dateOptions);
    }

    updateClock();
    setInterval(updateClock, 1000);

    // Toast Notification
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Copy Single Field
    function copyText(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`تم نسخ ${label}`);
      });
    }

    // Get Formatted Details Text
    function getFormattedDetails() {
      return `🏦 *Details van de rekening*\n\n` +
             `👤 *Naam:* MME MOUNYA HAFIDI\n` +
             `💳 *IBAN:* BE80 0004 3273 4477\n` +
             `🏦 *BIC:* GEBABEBB\n` +
             `📋 *Type:* Pack Easy Go`;
    }

    // Copy All Details
    function copyAllDetails() {
      const fullText = getFormattedDetails();
      navigator.clipboard.writeText(fullText).then(() => {
        showToast('تم نسخ جميع البيانات بنجاح!');
      });
    }

    // Send via WhatsApp
    function sendWhatsApp(event) {
      event.preventDefault();
      const text = encodeURIComponent(getFormattedDetails());
      window.open(`https://wa.me/?text=${text}`, '_blank');
    }
  </script>
</body>
</html>
