<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Details van de rekening & Live Clock</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --accent: #00897b;
      --accent-light: #e0f2f1;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* Live Clock Widget */
    .clock-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.25rem 2.5rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 2rem;
      width: 100%;
      max-width: 480px;
    }

    .clock-time {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .clock-date {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Details Card */
    .details-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 1.75rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .card-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #111827;
    }

    .details-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #f3f4f6;
    }

    .detail-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .label {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      text-align: right;
    }

    .download-button {
      margin-top: 1.5rem;
      background-color: var(--accent-light);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 0.85rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .download-button:hover {
      background-color: #b2dfdb;
    }
  </style>
</head>
<body>

  <!-- Real-Time Clock & Date Widget -->
  <div class="clock-container">
    <div class="clock-time" id="time">00:00:00</div>
    <div class="clock-date" id="date">--</div>
  </div>

  <!-- Account Details Card -->
  <div class="details-card">
    <div class="card-header">
      <div class="card-title">Details van de rekening</div>
    </div>

    <div class="details-list">
      <div class="detail-item">
        <span class="label">Naam rekeninghouder</span>
        <span class="value">MME MOUNYA HAFIDI</span>
      </div>

      <div class="detail-item">
        <span class="label">Benaming rekening</span>
        <span class="value">MME MOUNYA HAFIDI</span>
      </div>

      <div class="detail-item">
        <span class="label">Rekeningnummer</span>
        <span class="value">BE80 0004 3273 4477</span>
      </div>

      <div class="detail-item">
        <span class="label">BIC</span>
        <span class="value">GEBABEBB</span>
      </div>

      <div class="detail-item">
        <span class="label">Uw relatie tot de rekening</span>
        <span class="value">Titulaire</span>
      </div>

      <div class="detail-item">
        <span class="label">Rekeningtype</span>
        <span class="value">Pack Easy Go</span>
      </div>
    </div>

    <div class="download-button">
      Download attest identificatie rekening (RIB)
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      
      // Formatting Time (12-hour format with AM/PM)
      const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      document.getElementById('time').textContent = now.toLocaleTimeString('en-US', timeOptions);

      // Formatting Date in Arabic
      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('ar-EG', dateOptions);
    }

    // Run clock on load and update every second
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
